<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Intelligence OS UX Prototype</title>
<style>
:root{
  --bg:#0c1118;--bg2:#0f1620;--panel:#131b27;--panel2:#18222f;--panel3:#1e2a3a;--line:#263244;--line2:#324258;
  --text:#e7edf5;--text2:#b4c0d0;--muted:#8394a9;--accent:#3d9bff;--accent2:#1f6fd1;--accentbg:rgba(61,155,255,.14);
  --ok:#3fbf86;--okbg:rgba(63,191,134,.14);--warn:#e8a82a;--warnbg:rgba(232,168,42,.14);--err:#f0625f;--errbg:rgba(240,98,95,.15);
  --info:#6aa9ff;--infobg:rgba(106,169,255,.13);--plan:#b794f4;--planbg:rgba(183,148,244,.15);
  --r:8px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.ribbon{background:#1a2230;border-bottom:1px solid var(--line);color:var(--text2);font-size:12.5px;padding:6px 16px;display:flex;gap:12px;align-items:center}
.ribbon b{color:var(--warn);letter-spacing:.06em;font-size:11.5px}
.ribbon .sp{flex:1}
.shell{display:grid;grid-template-columns:196px 1fr;min-height:0}
.rail{background:var(--bg2);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700;font-size:15px}
.brand i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#3d9bff,#2dd4bf);display:inline-block}
.rail h6{margin:14px 10px 4px;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--text2);background:none;border:0;text-align:left;width:100%}
.nav:hover{background:var(--panel)}
.nav.on{background:var(--accentbg);color:#fff}
.nav .t{margin-left:auto}
main{min-width:0;min-height:0;display:flex;flex-direction:column}
.page{flex:1;min-height:0;overflow:auto;padding:22px 28px}
.page h1{font-size:21px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{margin:0 0 6px;font-size:14.5px}
.card p{margin:0;color:var(--text2)}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:6px 12px;color:var(--text);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--panel3)}
.btn.pri{background:var(--accent2);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover:not(:disabled){background:#2a7ee6}
.btn.ghost{background:none;border-color:transparent;color:var(--text2)}
.btn.ghost:hover:not(:disabled){background:var(--panel2)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:5px;border:1px solid}
.tag.planned{color:var(--plan);background:var(--planbg);border-color:rgba(183,148,244,.4)}
.tag.sim{color:var(--muted);border-color:var(--line2)}
.tag.live{color:var(--ok);background:var(--okbg);border-color:rgba(63,191,134,.4)}
.tag.partial{color:var(--warn);background:var(--warnbg);border-color:rgba(232,168,42,.4)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--text2)}
.pill.ok{color:var(--ok);background:var(--okbg);border-color:transparent}.pill.warn{color:var(--warn);background:var(--warnbg);border-color:transparent}
.pill.err{color:var(--err);background:var(--errbg);border-color:transparent}.pill.info{color:var(--info);background:var(--infobg);border-color:transparent}
.muted{color:var(--muted)}.t2{color:var(--text2)}.mono{font-family:var(--mono);font-size:12.5px}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;width:100%}
textarea{resize:vertical;min-height:64px}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--text)}.tab.on{color:#fff;border-bottom-color:var(--accent)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}.dot.info{background:var(--info)}
table.g{border-collapse:collapse;width:100%;font-size:12.5px}
table.g th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.g th small{display:block;font-weight:400;color:var(--muted);font-family:var(--mono);font-size:11px}
table.g td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--mono)}
table.g td.n{text-align:right}table.g td.null{color:var(--warn);font-style:italic}
table.g tr:hover td{background:rgba(255,255,255,.025)}
table.g td.rn,table.g th.rn{color:var(--muted);text-align:right;width:40px}
.scroll{overflow:auto;min-height:0}
/* notices */
.notices{display:flex;flex-direction:column;gap:6px;padding:8px 14px 0}
.notice{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:8px;border:1px solid;font-size:13px}
.notice.error{background:var(--errbg);border-color:rgba(240,98,95,.5)}.notice.action{background:var(--accentbg);border-color:rgba(61,155,255,.5)}
.notice.warning{background:var(--warnbg);border-color:rgba(232,168,42,.5)}.notice.info{background:var(--infobg);border-color:rgba(106,169,255,.35)}
.notice .b{flex:1}.notice .acts{display:flex;gap:6px}
/* studio */
.studio{flex:1;min-height:0;display:flex;flex-direction:column}
.tbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.tbar input.name{width:260px;background:transparent;border-color:transparent;font-weight:600;font-size:15px}
.tbar input.name:hover,.tbar input.name:focus{background:var(--bg);border-color:var(--line2)}
.vsep{width:1px;height:22px;background:var(--line2)}
.guide{border-bottom:1px solid var(--line);background:var(--bg2);padding:8px 14px}
.stages{display:flex;gap:6px;align-items:center}
.stg{display:flex;align-items:center;gap:7px;padding:4px 11px 4px 6px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);color:var(--text2);font-size:13px}
.stg .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--panel3);color:var(--text2)}
.stg.on{border-color:var(--accent);color:#fff;background:var(--accentbg)}
.stg.complete .n{background:var(--ok);color:#06210f}.stg.blocked .n,.stg.invalid .n{background:var(--err);color:#2a0606}
.stg.review .n{background:var(--warn);color:#2a1d00}
.stg-sep{width:14px;height:1px;background:var(--line2)}
.ginst{display:flex;gap:14px;align-items:center;margin-top:7px}
.ginst .msg{flex:1;font-size:14px}.ginst .msg b{color:#fff}
.work{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr auto;position:relative}
.palette{width:156px;border-right:1px solid var(--line);background:var(--bg2);padding:10px;overflow:auto;transition:width .15s}
.palette.col1{width:0;padding:0;border:0;overflow:hidden}
.palette h6{margin:8px 4px 5px;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.pal{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:7px;background:none;border:1px solid transparent;color:var(--text2);text-align:left;font-size:13px}
.pal:hover{background:var(--panel);border-color:var(--line)}
.pal .tag{margin-left:auto;padding:0 4px;font-size:9.5px}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.canvaswrap{flex:1;position:relative;min-height:0;overflow:hidden;background:
 radial-gradient(circle,#243145 1px,transparent 1.2px) 0 0/22px 22px, var(--bg);cursor:grab}
.canvaswrap.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:#5a6e88;stroke-width:2}.edge.sel{stroke:var(--accent);stroke-width:2.6}.edge.stale{stroke-dasharray:6 5}
.edge.warn{stroke:var(--warn)}
.edgex{pointer-events:all;cursor:pointer}.edgex circle{fill:var(--panel2);stroke:var(--line2)}.edgex:hover circle{fill:var(--errbg);stroke:var(--err)}
.edgex text{fill:var(--text2);font-size:12px;text-anchor:middle;dominant-baseline:central}
.node{position:absolute;width:196px;height:92px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;cursor:move;user-select:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.node:hover{border-color:#486182}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentbg),0 2px 10px rgba(0,0,0,.35)}
.node .h{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.node .h .st{margin-left:auto;display:flex;gap:5px;align-items:center}
.node .ti{font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.node .su{color:var(--text2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.node .ft{position:absolute;left:10px;right:10px;bottom:7px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.node .ft .tag{margin-left:auto}
.node.planned{border-style:dashed}
.node.t-source .h .ico{color:#6cc6ff}.node.t-join .h .ico{color:#f0b429}.node.t-output .h .ico{color:var(--ok)}
.node.t-aggregate .h .ico,.node.t-derive .h .ico{color:var(--plan)}
.sd{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.sd.ready{background:#5a6e88}.sd.fresh{background:var(--ok)}.sd.stale{background:var(--warn)}.sd.err{background:var(--err)}.sd.warn{background:var(--warn)}
.sd.run{background:var(--accent);animation:pulse 1s infinite}.sd.done{background:var(--ok)}.sd.fail{background:var(--err)}.sd.q{background:#5a6e88}
@keyframes pulse{50%{opacity:.35}}
.port{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid #6b82a2;z-index:2}
.port:hover{border-color:var(--accent);background:var(--accent)}
.port.out{right:-7px}.port.in{left:-7px}
.cvtools{position:absolute;top:10px;right:10px;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:4px;z-index:5}
.cvtools .btn{padding:4px 7px}
.mini{position:absolute;left:10px;bottom:10px;width:170px;height:104px;background:rgba(19,27,39,.92);border:1px solid var(--line2);border-radius:8px;z-index:5}
.cvempty{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none}
.cvempty .card{pointer-events:all;max-width:440px;text-align:center}
.hint{position:absolute;left:196px;bottom:10px;font-size:12px;color:var(--muted);z-index:4}
.right{width:360px;border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
.right.col1{width:0;border:0;overflow:hidden}
.rbody{flex:1;overflow:auto;padding:12px 14px}
.dock{border-top:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
.dock .dh{display:flex;align-items:center;padding-right:8px}
.dock .db{flex:1;min-height:0;overflow:auto}
.sect{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:10px;background:var(--panel)}
.sect h4{margin:0 0 6px;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.chk{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:flex-start}
.chk .ico{margin-top:2px}.chk.error .ico{color:var(--err)}.chk.warning .ico{color:var(--warn)}.chk.info .ico{color:var(--info)}.chk.passed .ico{color:var(--ok)}
.chk .b{flex:1}.chk .ev{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
.stale-banner{display:flex;gap:8px;align-items:center;background:var(--warnbg);color:var(--warn);padding:6px 12px;font-size:13px;border-bottom:1px solid rgba(232,168,42,.3)}
.sim-banner{background:var(--panel2);color:var(--muted);padding:3px 12px;font-size:12px;border-bottom:1px solid var(--line)}
.sugg{border:1px solid var(--line2);border-radius:9px;padding:10px 12px;margin-bottom:10px;background:var(--panel)}
.sugg h5{margin:0 0 4px;font-size:13.5px;display:flex;gap:6px;align-items:center}
.sugg .why{color:var(--text2);font-size:12.5px;margin:4px 0}.sugg .ev{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sugg .acts{display:flex;gap:6px;margin-top:8px}
.bar{height:8px;background:var(--panel3);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--ok)}.bar.err i{background:var(--err)}
.modal-bg{position:fixed;inset:0;background:rgba(3,6,10,.66);display:grid;place-items:center;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:20px;width:min(640px,92vw);max-height:86vh;overflow:auto}
.modal h2{margin:0 0 8px;font-size:17px}
.ml{display:grid;grid-template-columns:300px 1fr;gap:0;height:100%;min-height:0}
.list{border-right:1px solid var(--line);overflow:auto;min-height:0}
.li{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.li:hover{background:var(--panel)}.li.on{background:var(--accentbg)}
.li input{width:auto}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.menu{position:absolute;right:16px;top:44px;z-index:40;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px;width:300px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line2);border-radius:9px;padding:8px 14px;z-index:60;display:flex;gap:12px;align-items:center}
.spin{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
kbd{font-family:var(--mono);font-size:11.5px;background:var(--panel3);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
details>summary{cursor:pointer;color:var(--text2)}
.sqlbox{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px;white-space:pre-wrap;color:#b9d4f5}
.diff-add{color:var(--ok)}.diff-del{color:var(--err)}.diff-chg{color:var(--warn)}
@media (max-width:1280px){.right{width:320px}.palette{width:150px}}
#app{position:relative}
.pal.rec{border-color:var(--accent);background:var(--accentbg);color:#fff}
.pal.rec::after{content:"Next";margin-left:auto;font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase}
.sect .pal{width:100%}
.ribbon .btn{flex:none}
main>.ml{flex:1}
.studio .work{margin-top:0!important}
.node:focus-visible{outline:2px solid var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.port::before{content:"";position:absolute;inset:-9px}
.palette{width:190px}.pal span:not(.tag){white-space:normal;line-height:1.2}.pal .tag{flex:none}.pal span:not(.tag){min-width:0}
.hf{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:10px;background:var(--panel2,transparent)}
.hf .ai{display:flex;gap:8px;margin-top:8px;padding:8px;border-radius:7px;background:var(--accentbg);font-size:12.5px;line-height:1.4}
.hf .ai svg{flex:none;color:var(--accent);margin-top:2px}
.hf .eff{margin-top:8px;padding:8px;border:1px dashed var(--line2);border-radius:7px;font-size:12.5px}
.node .ft .pill{margin-left:auto;padding:0 6px;font-size:11px}

</style></head><body>

 if(p.nodes.some(n=>n.type==='source'&&n.config.table==='orders')&&cn){const cs=new Set(TABLES.customers.rows.map(x=>x.customer_id));const o=TABLES.orders.rows.filter(r=>!cs.has(r.customer_id));if(o.length)add({id:'orphans',level:'info',title:`${o.length} orders have no matching customer`,plain:'These orders are not in the dataset because it starts from customers. This may be correct, but tell the data owner if it is not expected.',evidence:`orders.customer_id not found in customers: ${o.length} rows (${o.map(x=>x.customer_id).slice(0,3).join(', ')}…)`,node:p.nodes.find(n=>n.type==='source'&&n.config.table==='orders').id})}
 const planned=p.nodes.filter(n=>!NT[n.type].live);if(planned.length)add({id:'planned',level:'info',title:`${planned.length} step${planned.length>1?'s use':' uses'} operations not yet available in the real product`,plain:`${[...new Set(planned.map(n=>NT[n.type].label))].join(', ')} ${planned.length>1?'are':'is'} shown in this prototype to demonstrate the experience. The current backend cannot execute ${planned.length>1?'them':'it'} yet.`,evidence:'See the feasibility matrix',node:planned[0].id});

/* ===== Guide (five stages derived from real pipeline state) ===== */
function computeStages(){
 const p=P(),out=outputNode(),sg=SG();const srcs=p.nodes.filter(n=>n.type==='source'),joins=p.nodes.filter(n=>n.type==='join'),trans=p.nodes.filter(n=>!['source','join','output'].includes(n.type));
 const st={};let bad=null;
 st.select=!srcs.length?'incomplete':srcs.some(n=>!n.config.table)?'incomplete':'complete';
 st.join=srcs.length<2?'not_needed':(joins.length<srcs.length-1||joins.some(j=>nodeIssues(p,j).length))?'incomplete':'complete';
 st.transform=!trans.length?'optional':trans.some(n=>nodeIssues(p,n).length)?'incomplete':'complete';
 const anc=out?ancestors(out.id):new Set();const open=out?[...anc].filter(id=>nodeIssues(p,nodeById(p,id)).length):[];
 let v='incomplete',hint=null;
 if(out&&!nodeIssues(p,out).length&&!open.length){const un=joins.filter(j=>anc.has(j.id)&&['unmeasured','outdated'].includes(joinStatus(j)));const rv=joins.filter(j=>anc.has(j.id)&&joinStatus(j)==='review');
  if(un.length){v=un.some(j=>joinStatus(j)==='outdated')?'measurement_outdated':'measurement_required';hint=un[0].id}
  else if(rv.length){v='review_required';hint=rv[0].id}
  else if(!S.val)v='not_validated';else if(S.val.sig!==pipeSig())v='outdated';else if(S.val.checks.some(c=>c.level==='error')){v='invalid';hint=S.val.checks.find(c=>c.level==='error').node}else v='complete'}
 else hint=open[0]||(out?out.id:null);
 st.validate=v;
 const lastRun=S.run&&S.run.sig===pipeSig()?S.run:null;
 let f='blocked';if(v==='complete'){f='ready';if(S.run&&S.run.state==='running')f='running';else if(lastRun&&lastRun.state==='failed')f='run_failed';else if(lastRun&&lastRun.state==='done')f=S.datasets.some(d=>d.runId===lastRun.id)?'published':'ran'}
 st.final=f;
 return{st,hint,out,srcs,joins,open}}
const STAGE_LABEL={select:'Select tables',join:'Join',transform:'Transform',validate:'Validate',final:'Final dataset'};
const STAGE_ORDER=['select','join','transform','validate','final'];
function autoStage(st){for(const s of STAGE_ORDER){if(!['complete','optional','not_needed'].includes(st[s]))return s}return 'final'}
function guideFor(stage,G){const {st,hint,out,srcs,joins}=G,s=st[stage];
 const A=(label,act,arg)=>({label,act,arg});
 const t={
  select:{incomplete:srcs.length?[ 'A source step has no table yet. Select it and choose a table.',A('Choose a table','selNode',srcs.find(n=>!n.config.table)&&srcs.find(n=>!n.config.table).id)]:['Start by choosing the tables you need from the Catalog.',A('Open Catalog','go','catalog')],complete:[`${srcs.length} table${srcs.length>1?'s':''} on the canvas. Next, connect them with joins.`,A('Next: Join','stage','join')]},
  join:{not_needed:['One table needs no join. Move on to Transform.',A('Next: Transform','stage','transform')],incomplete:[joins.length?'Finish each join: connect both inputs and choose the matching columns.':'Tables are not connected yet. Open the Assistant for suggested joins, or add a Join step from the palette.',joins.length?A('Finish '+((joins.find(j=>nodeIssues(P(),j).length)||joins[0]).id),'selNode',(joins.find(j=>nodeIssues(P(),j).length)||joins[0]).id):A('See suggested joins','assistant')],complete:['Joins are set up. Their effect on your row counts is measured in Validate.',A('Next: Transform','stage','transform')]},
  transform:{optional:['Optional: clean each table (select it, then open Data health), filter rows or summarise. Or continue to Validate.',A('Skip to Validate','stage','validate')],incomplete:['Finish the step you started: choose its columns or conditions, or remove it.',P().nodes.find(n=>!['source','join','output'].includes(n.type)&&nodeIssues(P(),n).length)?A('Open it','selNode',P().nodes.find(n=>!['source','join','output'].includes(n.type)&&nodeIssues(P(),n).length).id):null],complete:['Transform steps are set up. Continue to Validate.',A('Next: Validate','stage','validate')]},
  validate:{incomplete:[!out?'Add an Output dataset step at the end of the flow (highlighted in the palette).':'Some steps still need setup. Finish them, then connect the last step to Output.',hint?A('Go to '+hint,'selNode',hint):null],
   measurement_required:['Measure each join on the real data before trusting it. Select a join and press Measure.',A('Open '+hint,'selNode',hint)],measurement_outdated:['A join changed after it was measured. Measure it again.',A('Open '+hint,'selNode',hint)],
   review_required:['A join repeats rows. Read the explanation and accept it only if that is what you intend.',A('Review '+hint,'selNode',hint)],not_validated:['Run validation to check the final dataset against real data.',A('Run validation','validate')],
   outdated:['Something changed after the last validation. Run it again.',A('Run validation again','validate')],invalid:['Validation found a problem that blocks the dataset. Start with the first error.',A('Go to the problem','selNode',hint)],complete:['All checks ran on current settings and no errors remain. Continue to the final dataset.',A('Next: Final dataset','stage','final')]},
  final:{blocked:['Finish Validate first. The dataset cannot run until every error is resolved.',null],ready:['Ready. Starting the run executes every step in order and builds the dataset.',A('Start run','run')],running:['The pipeline is running. Step status is shown below.',null],run_failed:['The last run failed. The Run tab shows which step failed and why. Retrying uses the same settings.',A('Retry run','run')],ran:['The run succeeded. Review the Final dataset tab, then publish it. Publishing needs your approval.',A('Publish dataset','publishAsk')],published:['Published. Send it to AutoML or find it under Datasets.',A('Send to AutoML','dsOpen')]}};
 const x=(t[stage]||{})[s]||['',null];return{msg:x[0],primary:x[1],status:s}}

  h+=`<div class="hf"><div class="row"><b class="mono">${esc(f.col)}</b><span class="sp"></span><span class="pill warn">${f.kind==='dup'?`${f.keys} repeated value${f.keys>1?'s':''} · ${f.extra} extra row${f.extra>1?'s':''}`:`${fmt(f.n)} of ${fmt(f.total)} empty (${(100*f.pct).toFixed(1)}%)`}</span></div>
  <div class="ai">${ic('ai',14)}<div><b>Suggested: ${esc(CHOICE_LABEL[rec.pick])}.</b> ${esc(rec.why)}<div class="muted" style="font-size:11.5px;margin-top:3px">Rule-based suggestion in this prototype. You decide.</div></div></div>

 return h+'</div>'}

/* join measurement */
function viewMeasure(j){const st=joinStatus(j),m=S.meas[j.id],sg=SG(),busy=S.ui.busy['m:'+j.id];
 let h=`<div class="sect"><h4>Join measurement ${tag('sim','Calculated on sample data')}</h4>`;
 if(st==='setup')return h+`<p class="muted">Finish the join settings first. Then you can measure how the two inputs match on the real rows.</p></div>`;
 if(busy)return h+`<div class="row"><span class="spin"></span> Measuring both inputs…</div></div>`;
 if(!m||m.sig!==sg[j.id]){h+=`<p class="t2">${m?'<b style="color:var(--warn)">Out of date.</b> This join or its inputs changed after the last measurement.':'Not measured yet.'} Measuring counts matches, unmatched rows and repeated rows using the actual data, so you can see the effect before trusting the join.</p><div style="margin-top:8px">${btn('measure',m?'Measure again':'Measure join',{arg:j.id,cls:'pri',id:'measure'})}</div></div>`;return h}
 const x=m.m,pct=v=>(100*v/(x.leftRows||1)).toFixed(1)+'%';
 h+=`<dl class="kv"><dt>Left rows</dt><dd>${fmt(x.leftRows)}</dd><dt>Right rows</dt><dd>${fmt(x.rightRows)}</dd><dt>Left rows with a match</dt><dd>${fmt(x.matched)} (${pct(x.matched)})</dd><dt>Left rows without a match</dt><dd>${fmt(x.unmatchedLeft)}</dd><dt>Right rows never used</dt><dd>${fmt(x.rightUnmatched)}</dd><dt>Relationship</dt><dd>${x.cardinality} (up to ${x.maxPerKey} right rows per key)</dd><dt>Output rows</dt><dd><b>${fmt(x.out)}</b> (from ${fmt(x.baseRows)})</dd></dl>
 <div class="bar ${x.matched/x.leftRows>.95?'ok':''}" style="margin-top:8px" aria-hidden="true"><i style="width:${pct(x.matched)}"></i></div>`;
 if(x.fanOut){const ack=S.acks[j.id]===m.sig;h+=`<div class="notice ${ack?'info':'warning'}" style="margin-top:10px">${ic('warn')}<div class="b"><b>Rows are repeated.</b> ${fmt(x.baseRows)} rows became ${fmt(x.out)} (+${fmt(x.extra)}). ${x.leftDupRows?`${fmt(x.leftDupRows)} left rows share a key with another left row, which multiplies matches. `:''}A later step (such as Aggregate) must return the data to the grain you want, or totals will be overcounted.</div></div>
  ${ack?`<div class="row" style="margin-top:8px"><span class="pill ok">You accepted this</span>${btn('unack','Withdraw',{arg:j.id,cls:'sm ghost'})}</div>`:`<label class="row" style="margin-top:8px;align-items:flex-start"><input type="checkbox" id="ackchk" style="width:auto;margin-top:3px" data-chg="ackTick" ${S.ui.ackTick?'checked':''}> <span>I understand that rows are repeated and I will bring the data back to the right grain in a later step.</span></label><div style="margin-top:8px">${btn('ack','Accept repeated rows',{arg:j.id,cls:'pri',id:'ackbtn',dis:!S.ui.ackTick})}</div>`}`}
 else h+=`<div class="notice info" style="margin-top:10px">${ic('passed')}<div class="b">No repeated rows from this join. ${x.unmatchedLeft?`${fmt(x.unmatchedLeft)} left rows have no match; with a ${j.config.type.toUpperCase()} join they ${j.config.type==='inner'?'are dropped':'are kept with empty values'}.`:''}</div></div>`;
 return h+`<div style="margin-top:8px">${btn('measure','Measure again',{arg:j.id,cls:'sm ghost'})}</div></div>`}

/* ===== Assistant ===== */
function suggestions(G){G=G||S._G||computeStages();const out=[],p=P(),dis=S.ui.dismissed;
 const tablesOf=id=>{const s=new Set();const w=i=>{const n=nodeById(p,i);if(!n)return;if(n.type==='source'&&n.config.table)s.add(n.config.table);inputsOf(p,i).forEach(x=>x&&w(x))};w(id);return s};
 const used=new Set(p.edges.map(e=>e.from));const front=p.nodes.filter(n=>!['output'].includes(n.type)&&!used.has(n.id)&&(n.type!=='source'||n.config.table));
 // 1. join suggestions between loose pieces
 for(let a=0;a<front.length;a++)for(let b=0;b<front.length;b++){if(a===b)continue;const A=front[a],B=front[b];const ta=tablesOf(A.id),tb=tablesOf(B.id);
  const rel=REL.find(r=>{const[f]=r.from.split('.'),[t]=r.to.split('.');return ta.has(t)&&tb.has(f)});if(!rel)continue;const key='join:'+A.id+'>'+B.id;if(dis[key])continue;if(out.some(o=>o.pairKey===[A.id,B.id].sort().join()))continue;
  const[,fc]=rel.from.split('.'),[,tc]=rel.to.split('.');out.push({id:key,pairKey:[A.id,B.id].sort().join(),kind:'join',title:`Join ${A.id} to ${B.id} on ${tc} = ${fc}`,why:rel.kind==='declared'?'A foreign key is declared in the database between these tables. A LEFT join keeps every row of the left side.':rel.why,ev:`${rel.from} → ${rel.to}: ${(rel.match*100).toFixed(1)}% of values match${rel.kind==='declared'?' · declared relationship':' · inferred, not declared'}`,conf:rel.kind==='declared'?'High':'Medium',warn:rel.kind==='inferred'?'Inferred relationship. Check the match rate before relying on it.':null,args:{a:A.id,b:B.id,l:tc,r:fc}})}
 // 3. aggregate suggestion for the customer goal
 const j=p.nodes.filter(n=>n.type==='join'),lastJ=j.find(n=>!p.edges.some(e=>e.from===n.id&&nodeById(p,e.to).type!=='output'));
 const hasAgg=p.nodes.some(n=>n.type==='aggregate');
 if(lastJ&&!hasAgg&&!dis.agg&&G.joins.every(x=>!nodeIssues(p,x).length)&&tablesOf(lastJ.id).has('order_items')&&tablesOf(lastJ.id).has('customers'))out.push({id:'agg',kind:'agg',title:'Aggregate to one row per customer',why:'Your goal is a customer-level dataset. After the joins each customer appears once per order line. Grouping by customer returns one row per customer with the order count, total order value and latest order date.',ev:'count_distinct(order_id), sum(line_total), max(order_date), grouped by customer fields',conf:'High',planned:true,args:{after:lastJ.id}});
 // 4. output
 if(!G.out&&!dis.out&&(hasAgg||(lastJ&&G.st.join==='complete'&&false))){const last=p.nodes.find(n=>!['output'].includes(n.type)&&!p.edges.some(e=>e.from===n.id));if(last)out.push({id:'out',kind:'out',title:'Add the Output dataset step',why:'The Output step marks the dataset this pipeline produces. Validation and the run need it.',ev:'Connects after '+last.id,conf:'High',args:{after:last.id}})}
 return out}
function viewAssistant(G){const sg=suggestions(G);
 return `<div class="row"><b>Suggestions</b>${tag('sim','Scripted, evidence-based')}</div><p class="muted" style="font-size:12.5px;margin:4px 0 10px">The assistant looks at your pipeline and the data, then proposes steps. Nothing is applied until you press Accept, and every change appears on the canvas where you can edit or undo it.</p>
 ${sg.length?sg.map(s=>`<div class="sugg" data-sugg="${esc(s.id)}"><h5>${ic('ai',14)}${esc(s.title)}${s.planned?tag('planned','Not in product yet'):''}<span class="pill ${s.conf==='High'?'ok':'warn'}" style="margin-left:auto">${s.conf}</span></h5><div class="why">${esc(s.why)}</div><div class="ev">${esc(s.ev)}</div>${s.warn?`<div class="row" style="color:var(--warn);margin-top:5px;font-size:12.5px">${ic('warn')}<span>${esc(s.warn)}</span></div>`:''}
  <div class="acts">${btn('suggAccept','Accept',{arg:s.id,cls:'sm pri'})}${s.kind==='join'?btn('suggEdit','Accept and edit',{arg:s.id,cls:'sm'}):''}${btn('suggReject','Reject',{arg:s.id,cls:'sm ghost'})}</div></div>`).join(''):`<div class="muted" style="padding:6px 0 12px">No suggestions right now. ${P().nodes.length?'Keep building, or run validation to get fixes based on measured problems.':'Add tables to get join suggestions.'}</div>`}
 <hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><b>Ask a question</b>
 <div class="row" style="flex-wrap:wrap;gap:6px;margin:8px 0">${['Why are rows repeated?','What does LEFT join do?','Is it safe to publish?','Which tables do I need?'].map(q=>btn('ask',q,{arg:q,cls:'sm'})).join('')}</div>
 <div class="row"><input type="text" id="askin" placeholder="Ask about joins, repeated rows, grain…" aria-label="Ask the assistant" data-inp="askin"><button class="btn sm pri" data-act="askTyped">Ask</button></div>
 <div class="col" style="margin-top:10px">${S.chat.map(m=>`<div class="sect" style="margin:0;${m.r==='me'?'background:var(--accentbg)':''}"><div class="muted" style="font-size:11.5px">${m.r==='me'?'You':'Assistant'}</div>${esc(m.t)}</div>`).join('')}</div>`}
const QA=[[/repeat|fan|multipl|more rows|inflat|overcount/i,()=>{const j=P().nodes.filter(n=>n.type==='join').map(n=>({n,m:S.meas[n.id]})).filter(x=>x.m&&x.m.m);return 'A join repeats rows when one left row matches several right rows (for example one customer with many orders). That is often correct, but totals then need care. '+(j.length?j.map(x=>`${x.n.id}: ${fmt(x.m.m.baseRows)} → ${fmt(x.m.m.out)} rows.`).join(' ')+' ':'Measure a join to see exactly how many rows it adds. ')+'Also check the key: if customer_id repeats in the customers table itself, every matching order is repeated again.'}],
 [/left|inner|join type/i,()=>'A LEFT join keeps every row from the left input and adds matching data from the right; unmatched rows get empty values. An INNER join keeps only rows that match on both sides, so customers without orders disappear. For a customer-level dataset, LEFT keeps customers who have not ordered yet.'],
 [/safe|publish|trust/i,()=>{const v=S.val&&S.val.sig===pipeSig()?S.val:null;return v?`Validation ran on the current settings: ${v.checks.filter(c=>c.level==='error').length} errors, ${v.checks.filter(c=>c.level==='warning').length} warnings, ${v.checks.filter(c=>c.level==='passed').length} passed. Publishing is only offered when no errors remain, and it always needs your approval.`:'Not yet. Run validation first; publishing needs a validation with no errors, a successful run and your approval.'}],
 [/table|need/i,()=>'For customer details, order count, total value and latest order date you need customers (who), orders (when, how many) and order_items (line values). The Catalog shows the declared relationships between them.'],
 [/aggregate|grain|one row/i,()=>'Grain means what one row represents. After joining customers, orders and items, one row is an order line. Aggregating by customer returns the grain to one row per customer.'],
 [/automl|model|train/i,()=>'After you publish a validated dataset it appears under Datasets, where you choose a target column and open the AutoML training flow. You make that choice; the assistant only ranks candidates.']];

/* ===== Dock: Preview, SQL, Validation, Run, Final dataset, History and lineage ===== */
const DOCK=[['preview','Preview'],['sql','SQL'],['validation','Validation'],['run','Run'],['final','Final dataset'],['history','History and lineage']];
function targetNode(){const p=P();return (S.ui.sel&&nodeById(p,S.ui.sel))||outputNode()||(p.nodes.length?nodeById(p,topo(p).slice(-1)[0]):null)}
function valState(){if(!S.val)return null;return S.val.sig===pipeSig()?'current':'old'}
function viewDock(G){const dot=k=>{if(k==='validation'){const v=S.val;if(!v)return '';const w=v.checks.some(c=>c.level==='error')?'err':v.checks.some(c=>c.level==='warning')?'warn':'ok';return `<i class="dot ${w}"></i>`}if(k==='run'&&S.run)return `<i class="dot ${S.run.state==='failed'?'err':S.run.state==='done'?'ok':'info'}"></i>`;return ''};
 const head=`<div class="dh"><div class="tabs" style="flex:1;border:0" role="tablist">${DOCK.map(([k,l])=>`<button class="tab ${S.ui.dock===k?'on':''}" role="tab" aria-selected="${S.ui.dock===k}" data-act="dock" data-arg="${k}">${dot(k)}${l}</button>`).join('')}</div>${S.ui.dockSize==='min'?btn('dockSize','',{arg:'normal',cls:'ghost sm',icon:'plus',aria:'Expand bottom panel'}):`${btn('dockSize','',{arg:S.ui.dockSize==='big'?'normal':'big',cls:'ghost sm',icon:'fit',aria:S.ui.dockSize==='big'?'Make the bottom panel smaller':'Make the bottom panel larger',title:'Resize'})}${btn('dockSize','',{arg:'min',cls:'ghost sm',icon:'minus',aria:'Collapse bottom panel'})}`}</div>`;
 if(S.ui.dockSize==='min')return head;
 const k=S.ui.dock;const body={preview:dockPreview,sql:dockSql,validation:dockValidation,run:dockRun,final:dockFinal,history:dockHistory}[k](G);
 return head+`<div class="db">${body}</div>`}

function dockPreview(){const n=targetNode();if(!n)return '<div class="muted" style="padding:16px">Nothing to preview yet. Add tables to the canvas first.</div>';
 const sg=SG(),pv=S.previews[n.id],busy=S.ui.busy['p:'+n.id],issues=nodeIssues(P(),n);
 const bar=(extra)=>`<div class="row" style="padding:8px 12px;border-bottom:1px solid var(--line)"><b>${esc(n.id)}</b><span class="muted">${esc(NT[n.type].label)}</span>${tag('sim','Calculated on sample data')}${NT[n.type].live?'':tag('planned')}<span class="sp"></span>${extra||''}</div>`;
 if(issues.length)return bar()+`<div class="muted" style="padding:16px">This step cannot be previewed yet: ${esc(issues[0])}</div>`;
 if(busy)return bar()+`<div class="row" style="padding:16px"><span class="spin"></span> Reading rows…</div>`;
 if(!pv)return bar()+`<div style="padding:16px"><p class="t2" style="margin:0 0 10px">A preview shows the actual rows this step produces. Nothing is loaded until you ask.</p>${btn('previewNode','Preview this step',{arg:n.id,cls:'pri',id:'previewbtn'})}</div>`;
 const stale=pv.sig!==sg[n.id],res=pv.res;
 return bar(`<span class="pill">${fmt(res.rows.length)} rows</span><span class="pill">${res.cols.length} columns</span><input type="search" data-inp="pq" value="${esc(S.ui.pq||'')}" placeholder="Search rows" aria-label="Search preview rows" style="width:160px">${stale?btn('previewNode','Refresh preview',{arg:n.id,cls:'sm pri'}):''}`)
  +(stale?`<div class="stale-banner">${ic('warn')} Preview is out of date. This step or something before it changed. The rows below are from before the change.</div>`:'')+grid(res,{limit:60,q:S.ui.pq})}

function dockSql(){const n=targetNode();if(!n)return '<div class="muted" style="padding:16px">No steps yet.</div>';const p=P();
 let full='';if(outputNode()){const ids=topo(p).filter(id=>id===outputNode().id||ancestors(outputNode().id).has(id));full='WITH\n'+ids.map(id=>`${id} AS (\n  ${nodeSql(p,nodeById(p,id)).replace(/\n/g,'\n  ')}\n)`).join(',\n')+`\nSELECT * FROM ${outputNode().id};`}
 return `<div class="grid2" style="padding:12px"><div><div class="row" style="margin-bottom:6px"><b>${esc(n.id)}</b>${tag('sim','Illustrative SQL')}</div><div class="sqlbox">${esc(nodeSql(p,n))}</div><p class="muted" style="font-size:12.5px;margin-top:6px">Read-only. The real product compiles each step into a SELECT in the data source's own dialect and never changes your database.${NT[n.type].live?'':' This step type is planned: its SQL is shown for explanation only.'}</p></div>
 <div><b>Whole pipeline</b><div class="sqlbox" style="margin-top:6px;max-height:190px;overflow:auto">${esc(full||'-- Add an Output step to see the full query.')}</div></div></div>`}

 <div class="row" style="padding:8px 12px;border-bottom:1px solid var(--line)"><span class="pill err">${cnt('error')} errors</span><span class="pill warn">${cnt('warning')} warnings</span><span class="pill info">${cnt('info')} notes</span><span class="pill ok">${cnt('passed')} passed</span><span class="muted" style="margin-left:auto;font-size:12px">Ran ${v.when} on current sample data ${tag('sim')}</span></div>
 ${c.map(x=>`<div class="chk ${x.level}" data-check="${esc(x.id)}">${ic(x.level==='passed'?'passed':x.level==='error'?'error':x.level==='warning'?'warn':'info')}<div class="b"><b>${esc(x.title)}</b><div class="t2">${esc(x.plain)}</div><div class="ev">Evidence: ${esc(x.evidence)}</div></div><div class="col" style="gap:5px;align-items:flex-end">${x.node&&nodeById(P(),x.node)?btn('selNode','Show step '+x.node,{arg:x.node,cls:'sm'}):''}${x.fixKey&&x.fixKey.type==='remove_duplicates'&&x.level==='error'&&st==='current'?btn('applyFix','Add suggested fix',{arg:x.id,cls:'sm pri',title:'Adds a fix to the table card '+x.fixKey.after+' (keep one row per value). You can undo it there.'}):''}${x.healthNode&&nodeById(P(),x.healthNode)&&st==='current'?btn('selNode','Open Data health',{arg:x.healthNode,cls:'sm'}):''}</div></div>`).join('')}`}

function runSteps(){const out=outputNode();if(!out)return[];const A=ancestors(out.id);return topo(P()).filter(id=>id===out.id||A.has(id))}
function dockRun(G){const r=S.run&&S.run.sig===pipeSig()?S.run:null,ids=runSteps();

function pathTo(fromId,toId){const q=[[fromId]],seen=new Set([fromId]);while(q.length){const pth=q.shift(),last=pth[pth.length-1];if(last===toId)return pth;P().edges.filter(e=>e.from===last).forEach(e=>{if(!seen.has(e.to)){seen.add(e.to);q.push([...pth,e.to])}})}return null}

 let body='';
 if(t==='lineage'){const out=outputNode();if(!out||G.st.validate==='incomplete')body='<div class="muted" style="padding:16px">Lineage appears once the pipeline reaches an Output step.</div>';

   ${sel&&(sel.origin||[]).length?sel.origin.map(o=>{const[tn]=o.split('.');const sn=srcs.find(s=>s.config.table===tn);const pth=sn?pathTo(sn.id,out.id):null;return `<div class="sect"><div class="row" style="flex-wrap:wrap;gap:6px"><span class="pill">${o}</span>${(pth||[]).map(id=>`<span class="muted">→</span><button class="pill info" data-act="selNode" data-arg="${id}">${id}</button>`).join('')}<span class="muted">→</span><span class="pill ok">${esc(sel.name)}</span></div></div>`}).join(''):'<p class="muted">This column is not read directly from a source column.</p>'}

 // assistant
 case 'suggAccept':case 'suggEdit':{const s=suggestions().find(x=>x.id===arg);if(!s)break;
  if(s.kind==='join'){const A=nodeById(P(),s.args.a),B=nodeById(P(),s.args.b);let jid;if(a==='suggEdit'){S.ui.right='settings';S.ui.rightOpen=true}batch('Accept suggested join',()=>{jid=rawNode('join',{type:'left',pairs:[{l:s.args.l,r:s.args.r}]},Math.max(A.x,B.x)+NW+60,(A.y+B.y)/2);wire(A.id,jid,'left');wire(B.id,jid,'right');S.ui.sel=jid});setTimeout(fitView,30);toast(a==='suggEdit'?`Added ${jid}. Adjust its settings in the panel.`:`Added ${jid}. Measure it before trusting it.`,{label:'Undo',fn:'undo'})}
  else if(s.kind==='agg'){const id=insertAfter(s.args.after,'aggregate',{by:['customer_id','customer_name','email','city','segment'],metrics:[{fn:'count_distinct',col:'order_id',as:'order_count'},{fn:'sum',col:'line_total',as:'total_order_value'},{fn:'max',col:'order_date',as:'latest_order_date'}]},'Accept suggested Aggregate');toast(`Added ${id}. Review its calculations.`,{label:'Undo',fn:'undo'})}
  else if(s.kind==='out'){batch('Accept suggested Output',()=>{const a=nodeById(P(),s.args.after),id=rawNode('output',{name:'customer_order_summary'},a.x+NW+60,a.y);wire(a.id,id,'in');S.ui.sel=id});toast('Added the Output step.',{label:'Undo',fn:'undo'})}
  break}
 case 'suggReject':S.ui.dismissed[arg]=true;render();toast('Suggestion rejected. It will not be shown again for this pipeline.');break;
 case 'ask':askQ(arg);break;
 case 'askTyped':{const i=$('#askin');if(i&&i.value.trim()){const v=i.value.trim();i.value='';askQ(v)}break}
 }}
function askQ(q){S.chat.push({r:'me',t:q});const hit=QA.find(x=>x[0].test(q));S.chat.push({r:'ai',t:hit?hit[1]():'This prototype only has a few scripted answers: repeated rows, join types, publishing, tables, grain and AutoML. A real assistant would answer from your schema and data.'});S.ui.right='assistant';render()}
function swapBack(){if(!S.backup)return;const cur={pipe:JSON.parse(JSON.stringify(S.pipe)),name:S.name};commit('Swap drafts');S.pipe=S.backup.pipe;S.name=S.backup.name;S.backup=cur;clearDerived();S.ui.sel=null;refresh();setTimeout(fitView,20);toast('Swapped drafts.',{label:'Swap back',fn:'swapBack'})}

/* ===== Change / input handlers ===== */
function onChg(k,el){const v=el.type==='checkbox'?el.checked:el.value,d=el.dataset,n=d.n;
 switch(k){
 case 'failSim':S.ui.failSim=v;break;
 case 'catSel':{const t=d.arg,i=S.catalog.sel.indexOf(t);if(v&&i<0)S.catalog.sel.push(t);if(!v&&i>=0)S.catalog.sel.splice(i,1);render();break}
 case 'cmpA':S.ui.cmpA=+d.arg;render();break;case 'cmpB':S.ui.cmpB=+d.arg;render();break;
 case 'jtype':S.ui.joinTypes=Object.assign({},S.ui.joinTypes,{[d.arg]:v});break;
 case 'migNote':S.migDecisions.note=v;break;case 'migReviewed':S.migDecisions.reviewed=v;render();break;
 case 'prop':S.ui.propChecked[d.arg]=v;break;
 case 'target':S.ui.target=d.arg;render();break;
 case 'pname':commit('Rename pipeline');S.name=v||'Untitled pipeline';refresh();break;
 case 'ackTick':S.ui.ackTick=v;render();break;case 'pubTick':S.ui.pubTick=v;render();break;
 case 'cfgInput':{if(!v){const i=P().edges.findIndex(e=>e.to===n&&e.port===d.port);if(i>=0)removeEdge(i);else render()}else{const err=connect(v,n,d.port);if(err){toast(err);render()}}break}
 case 'hChoice':{S.ui.hc=S.ui.hc||{};S.ui.hc[d.k]=Object.assign(S.ui.hc[d.k]||{val:''},{choice:v});render();break}
 case 'hVal':{S.ui.hc=S.ui.hc||{};S.ui.hc[d.k]=Object.assign(S.ui.hc[d.k]||{choice:'value'},{val:v});render();break}
 case 'cfgTable':setCfg(n,c=>{c.table=v||null},v?'Choose table '+v:'Clear table');break;
 case 'cfgJoinType':setCfg(n,c=>{c.type=v},'Change join type');break;
 case 'cfgPair':setCfg(n,c=>{c.pairs[+d.i][d.side]=v},'Change join columns');break;
 case 'cfgCond':setCfg(n,c=>{const q=c.conds[+d.i];q[d.f]=v;if(d.f==='op'&&/null/.test(v))q.value=''},'Change filter');break;
 case 'cfgDrop':setCfg(n,c=>{const i=c.cols.indexOf(d.c);if(v&&i<0)c.cols.push(d.c);if(!v&&i>=0)c.cols.splice(i,1)},'Change dropped columns');break;
 case 'cfgRename':setCfg(n,c=>{if(v.trim())c.map[d.c]=v.trim();else delete c.map[d.c]},'Rename column');break;
 case 'cfgDedupe':setCfg(n,c=>{const i=c.cols.indexOf(d.c);if(v&&i<0)c.cols.push(d.c);if(!v&&i>=0)c.cols.splice(i,1)},'Change duplicate columns');break;
 case 'cfgMissing':setCfg(n,c=>{c[d.f]=v},'Change missing-value handling');break;
 case 'cfgBy':setCfg(n,c=>{const i=c.by.indexOf(d.c);if(v&&i<0)c.by.push(d.c);if(!v&&i>=0)c.by.splice(i,1)},'Change grouping');break;
 case 'cfgMetric':setCfg(n,c=>{c.metrics[+d.i][d.f]=v},'Change calculation');break;
 case 'cfgDerive':setCfg(n,c=>{c[d.f]=v},'Change calculation');break;
 case 'cfgOut':setCfg(n,c=>{c.name=v},'Rename dataset');break;
 }}

/* ===== Event wiring ===== */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&el.dataset.act==='closeModalBg'&&e.target!==el)return;if(el&&!el.disabled&&el.getAttribute('aria-disabled')!=='true'){e.stopPropagation();act(el.dataset.act,el.dataset.arg,el);return}
 const mini=e.target.closest('[data-mini]');if(mini&&MM){const r=mini.getBoundingClientRect(),wx=(e.clientX-r.left-MM.ox)/MM.s+MM.minx,wy=(e.clientY-r.top-MM.oy)/MM.s+MM.miny,cv=$('#cv'),v=S.ui.view;S.ui.view={k:v.k,x:cv.clientWidth/2-wx*v.k,y:cv.clientHeight/2-wy*v.k};applyView()}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el)onChg(el.dataset.chg,el)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-inp]');if(!el)return;const k=el.dataset.inp;if(k==='goal')S.ui.goal=el.value;else if(k==='catq'){S.catalog.q=el.value;render()}else if(k==='pq'){S.ui.pq=el.value;render()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(S.ui.modal||S.ui.menu){S.ui.modal=null;S.ui.menu=false;render()}return}
 if(e.key==='Enter'&&e.target.closest&&e.target.closest('.node')){selectNode(e.target.closest('.node').dataset.node);return}
 if(e.key==='Enter'&&e.target.id==='askin'){act('askTyped');return}
 const t=e.target;if(/INPUT|TEXTAREA|SELECT/.test(t.tagName))return;if(S.route!=='studio'||S.ui.modal)return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
 if((e.key==='Delete'||e.key==='Backspace')&&S.ui.sel){e.preventDefault();removeNode(S.ui.sel);return}
 if(e.key==='f'||e.key==='F')fitView();if(e.key==='t'||e.key==='T')tidy()});
document.addEventListener('wheel',e=>{const cv=e.target.closest&&e.target.closest('#cv');if(!cv)return;e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});

let drag=null;
document.addEventListener('pointerdown',e=>{ptrDown=true;const cv=e.target.closest&&e.target.closest('#cv');if(!cv||e.button!==0)return;if(e.target.closest('.cvtools,.mini,.edgex,.cvempty .card,.hint'))return;
 const out=e.target.closest('[data-out]');
 if(out){drag={t:'conn',from:out.dataset.out};const tmp=document.createElementNS('http://www.w3.org/2000/svg','path');tmp.setAttribute('class','edge sel');tmp.id='tmp';$('#edges').appendChild(tmp);e.preventDefault();return}
 const nd=e.target.closest('.node');
 if(nd){const n=nodeById(P(),nd.dataset.node);if(!n)return;drag={t:'node',id:n.id,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y,moved:false,pre:snap(),el:nd};e.preventDefault();return}
 drag={t:'pan',sx:e.clientX,sy:e.clientY,vx:S.ui.view.x,vy:S.ui.view.y,moved:false};cv.classList.add('panning')});
document.addEventListener('pointermove',e=>{if(!drag)return;const v=S.ui.view;
 if(drag.t==='node'){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(!drag.moved&&Math.hypot(dx,dy)<4)return;drag.moved=true;const n=nodeById(P(),drag.id);n.x=Math.round(drag.ox+dx/v.k);n.y=Math.round(drag.oy+dy/v.k);drag.el.style.left=n.x+'px';drag.el.style.top=n.y+'px';$('#edges').innerHTML=edgesHtml();updateMini()}
 else if(drag.t==='pan'){S.ui.view={k:v.k,x:drag.vx+e.clientX-drag.sx,y:drag.vy+e.clientY-drag.sy};drag.moved=true;applyView()}
 else if(drag.t==='conn'){const a=nodeById(P(),drag.from),cv=$('#cv').getBoundingClientRect(),wx=(e.clientX-cv.left-v.x)/v.k,wy=(e.clientY-cv.top-v.y)/v.k,x1=a.x+NW,y1=a.y+NH/2;const tmp=$('#tmp');if(tmp)tmp.setAttribute('d',`M${x1} ${y1}C${x1+60} ${y1} ${wx-60} ${wy} ${wx} ${wy}`)}});
document.addEventListener('pointerup',e=>{const d=drag;drag=null;
 if(d){const cv=$('#cv');if(cv)cv.classList.remove('panning');
  if(d.t==='node'){if(d.moved){const n=nodeById(P(),d.id);if(n.x!==d.ox||n.y!==d.oy){commitPre('Move '+d.id,d.pre)}S.ui.sel=d.id;S.ui.right='settings';S.ui.rightOpen=true;pending=true}else{S.ui.sel=d.id;S.ui.right='settings';S.ui.rightOpen=true;S.ui.pq='';pending=true}}
  else if(d.t==='conn'){const tmp=$('#tmp');if(tmp)tmp.remove();const t=document.elementFromPoint(e.clientX,e.clientY);let to=null,port=null;const pe=t&&t.closest('.port.in');
   if(pe){to=pe.dataset.node;port=pe.dataset.port}else{const nd=t&&t.closest('.node');if(nd){to=nd.dataset.node;const tn=nodeById(P(),to);const ps=portsOf(tn.type);port=ps.find(p=>!P().edges.some(x=>x.to===to&&x.port===p))||ps[0]}}
   if(to&&to!==d.from){const tn=nodeById(P(),to);if(!port){toast(tn.type==='source'?'A source table has no input to connect to.':'That step has no input.')}else{const err=connect(d.from,to,port);if(err)toast(err)}}}
  else if(d.t==='pan'&&!d.moved){if(S.ui.sel){S.ui.sel=null;pending=true}}}
 ptrDown=false;setTimeout(()=>{if(pending){pending=false;render()}},0)});

function main(){document.body.insertAdjacentHTML('beforeend','<div id="toastbox"></div>');$('#app').setAttribute('data-ready','1');render();window.addEventListener('resize',()=>{if(S.route==='studio')updateMini()})}
main();

</script></body></html>
